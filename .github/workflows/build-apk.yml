name: Python APK Uret

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  # NOT: "issues: write" SADECE HATA - derleme loglarinin son kismini issue
  # yorumuna gonder adiminin (scripts/ci_post_build_log.py) GITHUB_TOKEN ile
  # issue #1'e yorum atabilmesi icin gerekli - o adim olmasa contents: read
  # yeterli olurdu. Bu izin olmadan POST /issues/1/comments 403 doner (bu,
  # tam da bu tani adiminin kendisinin sessizce basarisiz olmasina sebep
  # olan 2. hataydi - 1.si heredoc/IndentationError'du, ikisi de ayni run'da
  # ayni "step failed" gorunumunu verdigi icin Checks API annotation'lari
  # bunu ayirt etmedi, sadece "exit code 1" dedi).
  issues: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python bagimliliklarini kur (pytest)
        run: pip install --break-system-packages pytest

      - name: core.py testlerini calistir
        # KOK NEDEN (kod incelemesinde bulundu - "hic otomatik test yok"):
        # is mantigindaki (core.py) bir regresyon ONCEDEN sadece elle
        # (telefonda) fark edilebiliyordu - CI, Android APK'yi derleyip
        # derleyemedigine bakiyordu ama derlenen APK'nin DOGRU calisip
        # calismadigina hic bakmiyordu. tests/test_core.py artik en
        # riskli alanlari (kayit/okuma, onerilen agirlik/PR mantigi,
        # gecmis karsilastirma) kapsiyor - burada BASARISIZ olursa,
        # 5-15 dakika suren Android derlemesine hic girmeden erken ve
        # ucretsiz sekilde durup haber veriyoruz.
        #
        # NOT: burada BILEREK "tests/" degil "tests/test_core.py" veriyoruz -
        # tests/smoke_test.py da pytest'in varsayilan "*_test.py" desenine
        # uydugu icin dizin verilseydi pytest onu da TOPLAMAYA (import
        # etmeye) calisirdi; smoke_test.py Kivy'ye ihtiyac duyar ve bu adimda
        # (bilerek) sadece pytest kurulu - Kivy'yi gerektiren UI duman testi
        # asagida AYRI, kendi adiminda (kendi bagimliliklariyla) calisiyor.
        run: python3 -m pytest tests/test_core.py -v

      - name: UI duman testi icin sistem bagimliliklarini kur (Kivy + xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libsdl2-2.0-0 libmtdev1
          pip install --break-system-packages "kivy==2.3.1"

      - name: UI duman testini calistir (main.py + core.py, gercek Kivy ile)
        # KOK NEDEN (kod incelemesinde bulundu - "smoke_test.py hic repoya
        # kaydedilmemis"): bu oturumda "kayma" (popup render glitch) hatasi
        # basta olmak uzere defalarca elle telefonda bulunan davranis
        # kurallarini dogrulayan 29 adimlik test dosyasi SADECE gecici bir
        # calisma dizininde duruyordu - repoya hic girmemisti, yani bir
        # sonraki degisiklik bu regresyonlarin HICBIRINE karsi korumasizdi.
        # Simdi tests/smoke_test.py olarak kalici, ve CI'da (xvfb ile
        # headless olarak) her push'ta gercekten calistiriliyor.
        run: xvfb-run -a python3 tests/smoke_test.py

      - name: Build stamp'i main.py'ye gom
        # KOK NEDEN: main.py'deki APP_VERSION hicbir zaman degismiyordu -
        # art arda derlenen COK FARKLI APK'lar bile telefonda hep ayni
        # "sürüm 1.0" yazisini gosteriyordu, kullanicinin telefonda GERCEKTEN
        # hangi duzeltmenin kurulu oldugunu dogrulamasinin hicbir yolu yoktu.
        # Burada GERCEK commit kisa hash'ini + UTC derleme zamanini
        # BUILD_STAMP placeholder'inin yerine yaziyoruz; placeholder
        # bulunamazsa (main.py'de o satir yanlislikla silinmis/degismisse)
        # build'i BASARISIZ yapiyoruz - sessizce damgasiz bir APK
        # cikmasindansa build'in kirilmasi daha iyi.
        run: |
          STAMP="$(git rev-parse --short HEAD) · $(date -u +%Y-%m-%d\ %H:%M)UTC"
          echo "Build stamp: $STAMP"
          grep -q '__BUILD_STAMP__' main.py || {
            echo "HATA: main.py icinde __BUILD_STAMP__ placeholder'i bulunamadi - build stamp gomulamiyor." >&2
            exit 1
          }
          sed -i "s/__BUILD_STAMP__/${STAMP}/" main.py
          grep '^BUILD_STAMP' main.py

      - name: Android imzalama anahtarini (debug keystore) cache'den al
        # KOK NEDEN (kod incelemesinde bulundu - KRITIK - "CI'da her build'de
        # farkli bir imzalama anahtari uretiliyor"): bu is akisi HER
        # calismada SIFIRDAN bir konteynerde basliyordu ve ~/.android
        # (Android'in debug imzalama anahtarinin varsayilan konumu) HICBIR
        # YERDE kalici degildi. python-for-android/Gradle, bu dosyayi
        # bulamayinca YENI, RASTGELE bir anahtar cifti ile otomatik olarak
        # olusturuyor - yani HER APK FARKLI BIR IMZAYLA imzalaniyordu.
        # Android, farkli imzayla imzalanmis bir APK'yi mevcut kurulumun
        # UZERINE GUNCELLEME olarak kabul ETMEZ - kullanici her yeni build'i
        # kurmadan once ONCE ESKI UYGULAMAYI SILMEK zorunda kaliyordu, bu da
        # o cihazdaki tonaj_state.json'u (bulut/sunucu YOK, tek kopya bu)
        # KAYBETMESI anlamina geliyordu.
        #
        # DUZELTME: ~/.android dizinini (docker imajinda /home/user/.android)
        # runlar arasinda actions/cache ile SABIT bir anahtarla ("v1")
        # sakliyoruz - ilk calismada olusturulan debug.keystore, SONRAKI
        # HER calismada ayni haliyle geri yukleniyor. Boylece butun build'ler
        # AYNI imzayla imzalaniyor, kullanici APK'yi normal bir "guncelleme"
        # olarak kurabiliyor - verisi korunuyor.
        uses: actions/cache@v4
        with:
          path: .ci-cache/android-home
          key: android-debug-keystore-v1

      - name: Buildozer/python-for-android indirmelerini cache'le
        # KOK NEDEN (kod incelemesinde bulundu - "CI'da hic cache kullanilmiyor"):
        # .buildozer dizini Android SDK/NDK ve python-for-android'in indirdigi
        # butun bagimliliklari (yuzlerce MB) barindirir - bu ONCEDEN her
        # calismada sifirdan indiriliyordu, build'leri gereksiz yere uzatiyordu.
        # buildozer.spec degismedigi surece (requirements/android ayarlari
        # ayni kaldigi surece) bu indirmeler runlar arasinda AYNI - cache'den
        # geri yuklemek build suresini onemli olcude kisaltir.
        #
        # KOK NEDEN 2 (bu tani turunda issue #1 yorumundan BULUNDU - "Available
        # Android APIs are (): Requested API target 34 is not available"):
        # tani script'inin grep bloğu, tum log icinde sdkmanager/lisans/platform
        # indirme ile ilgili TEK BIR satir bile bulamadi - yani p4a, SDK
        # platformunu/build-tools'u indirmeye HIC TESEBBUS ETMEDI, dogrudan
        # bos bir platform listesiyle karsilasti. Bunun en olasi sebebi: bu
        # "buildozer-<hash>" anahtarli cache, DISK DOLU HATASININ (c30386b'de
        # duzeltildi) hala gerceklestigi ONCEKI bir calismada YARIM/BOZUK
        # (android-sdk dizini var ama platforms/build-tools icinde hicbir sey
        # yok) olarak KAYDEDILMIS olmasi - actions/cache bir anahtar zaten
        # varsa YENIDEN KAYDETMEZ, yani buildozer.spec hic degismedigi surece
        # (ki degismedi) TUM SONRAKI calismalar sonsuza kadar bu ayni BOZUK
        # cache'i geri yukleyip p4a'nin "SDK zaten kurulu" sanmasina (ve
        # gercekte icinde platform olmadigini fark etmeden hemen basarisiz
        # olmasina) sebep oluyordu.
        #
        # DUZELTME: anahtar onekini "buildozer-" -> "buildozer-v2-" yaptik
        # (hem key hem restore-keys) - GitHub'in restore-keys ONEK eslesmesi
        # eskiyi bir daha asla getirmeyecek, bu calisma SIFIRDAN temiz bir SDK
        # kurup dogru sekilde cache'e YENIDEN yazacak. Cache boyutu (~birkac
        # yuz MB - GB) nedeniyle bu calisma daha uzun surecek (ilk kurulum
        # gibi) - bu BEKLENEN ve GEREKLI bir tek seferlik maliyet.
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-

      - name: Buildozer'in resmi Docker imajiyla APK derle icin diskte yer ac
        # KOK NEDEN (bu commit'te eklenen UI duman testi adimlari icin
        # kurulan xvfb/libsdl2/Kivy paketleri, runner'in zaten SINIRLI olan
        # diskini - ghcr.io/kivy/buildozer imaji + .buildozer cache'i +
        # Android SDK/NDK indirmeleriyle zaten dolu - yeterince ITTI ve
        # docker'in cok-GB'lik buildozer imajini CEKME/ACMA asamasinda
        # "no space left on device" ile ANINDA (~100-150sn'de, normalde
        # 13-15dk suren bir derlemenin cok altinda) patlamasina sebep oldu):
        # runner'daki onceden kurulu, bu is icin GEREKSIZ buyuk paketleri
        # (Android Studio/SDK, .NET, Haskell, buyuk docker imaj onbellekleri)
        # buildozer imajini cekmeden ONCE silerek birkac GB yer aciyoruz.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                       /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                       /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          docker image prune -af || true
          df -h /

      - name: Buildozer'in resmi Docker imajiyla APK derle
        run: |
          mkdir -p .ci-cache/android-home
          chmod 777 .ci-cache/android-home  # konteyner icindeki kullanicinin yazabilmesi icin
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            -v "${{ github.workspace }}/.ci-cache/android-home:/home/user/.android" \
            ghcr.io/kivy/buildozer:latest android debug 2>&1 | tee /tmp/build.log

      - name: HATA - derleme loglarinin son kismini issue yorumuna gonder
        # KOK NEDEN (bu ajanin oturumundaki proxy, Actions log/artifact
        # indirmelerinin yonlendirdigi *.blob.core.windows.net adresini
        # SABIT olarak engelliyor - bu is akisinin gercek derleme hatasi
        # metnini normal "loglari indir" yollariyla okumak imkansiz hale
        # geliyordu). api.github.com (issues/comments) blob DEGIL, bu
        # proxy'den sorunsuz geciyor - o yuzden basarisizlik durumunda
        # derleme loginin son ~150 satirini GITHUB_TOKEN ile dogrudan
        # runner'dan (bizim proxy'mizden GECMEDEN) bir issue yorumu olarak
        # gonderiyoruz, boylece hatayi buradan okuyabiliyoruz.
        if: failure()
        # NOT: bu adimin komutu KASITLI olarak tek bir dosyaya (scripts/ci_post_build_log.py)
        # yazildi, YAML "run: |" blogunun icine gomulu bir python heredoc'u OLARAK DEGIL -
        # ilk denemede tam da bu heredoc yaklasimi kullanilmisti ve YAML'in blok
        # girintisini (indentation) heredoc govdesine oldugu gibi tasimasi yuzunden
        # ureteceleri python kodu satir basi girintili (indented) top-level ifadelere
        # donusuyordu -> "IndentationError" ile bu tani adiminin KENDISI sessizce
        # basarisiz oluyordu (build.log'daki asil hatayi hic goremeden). Ayri bir .py
        # dosyasi calistirmak bu sinif hatayi tamamen ortadan kaldirir.
        run: python3 scripts/ci_post_build_log.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Uretilen APK dosyasinin yolunu bul
        id: findapk
        run: |
          APK_PATH=$(find bin -name "*.apk" | head -n1)
          echo "APK bulundu: $APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: APK'yi yukle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: tonaj-apk
          path: ${{ steps.findapk.outputs.path }}
          retention-days: 90
