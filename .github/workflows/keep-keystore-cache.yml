name: Imza Anahtari Cache Canli Tut

# KOK NEDEN: APK imzalama anahtari (debug keystore) actions/cache'te saklaniyor
# (bkz. build-apk.yml). GitHub, 7 gun boyunca HIC erisilmeyen cache'leri
# siler. 30 Eyl -> 13 Eki arasinda build olmadigi icin cache silindi, yeni bir
# anahtar uretildi ve telefon "uygulama guncellenmedi" (imza uyusmazligi) dedi.
# Bu is, cache'i 3 gunde bir geri yukleyerek "son erisim" tarihini tazeler;
# boylece anahtar build yapilmayan haftalarda da silinmez.
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Imza anahtari cache'ini geri yukle (erisim tarihini tazeler)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/android-home
          key: android-debug-keystore-v1
      - name: Durum
        run: |
          echo "cache-hit=${{ steps.restore.outputs.cache-hit }}"
          if [ "${{ steps.restore.outputs.cache-hit }}" != "true" ]; then
            echo "::warning::Imza anahtari cache'i YOK - bir sonraki build yeni anahtar uretecek (telefonda uygulama guncellemesi reddedilir)."
          fi
